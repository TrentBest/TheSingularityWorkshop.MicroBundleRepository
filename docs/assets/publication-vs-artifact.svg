<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>Immutable artifacts and mutable publication</title><desc>Publication selects an immutable artifact without mutating its content.</desc><style>.bg{fill:#0b1020}.b{fill:#121a2d;stroke:#7dd3fc;stroke-width:2}.c{fill:#172554;stroke:#a5b4fc;stroke-width:2}.a{fill:#132e2a;stroke:#5eead4;stroke-width:2}.w{fill:#2b2110;stroke:#fbbf24;stroke-width:2}.t{fill:#f8fafc;font:600 24px system-ui}.s{fill:#cbd5e1;font:400 18px system-ui}.h{fill:#7dd3fc;font:700 30px system-ui}.ar{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><rect class="bg" width="1200" height="680"/><text class="h" x="60" y="65">Publication points at an artifact — it does not mutate it</text><rect class="c" x="70" y="140" width="300" height="150"/><text class="t" x="135" y="185">Immutable artifacts</text><text class="s" x="110" y="225">v1 + SHA-256</text><text class="s" x="110" y="253">v2 + SHA-256</text><text class="s" x="110" y="281">v3 + SHA-256</text><path class="ar" d="M370 215H500"/><rect class="a" x="500" y="140" width="300" height="150"/><text class="t" x="570" y="185">Publication pointer</text><text class="s" x="555" y="225">Experience 3201</text><text class="s" x="555" y="253">published → v2</text><text class="s" x="555" y="281">mutable selection</text><path class="ar" d="M800 215H930"/><rect class="b" x="930" y="140" width="200" height="150"/><text class="t" x="975" y="185">Host</text><text class="s" x="960" y="225">discover</text><text class="s" x="960" y="253">resolve identity</text><text class="s" x="960" y="281">retrieve bytes</text><rect class="w" x="220" y="390" width="760" height="125"/><text class="t" x="295" y="435">Unpublish ≠ delete</text><text class="s" x="295" y="475">Removing the pointer leaves immutable artifact history intact.</text><text class="s" x="320" y="590">Publication is state. Artifact identity is content.</text></svg>