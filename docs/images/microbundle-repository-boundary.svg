<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MicroBundle Repository — durable artifact delivery boundary</title>
  <desc id="desc">A visual architecture showing a published manifest and local cache requesting an immutable MicroBundle artifact, the repository resolving and verifying it from Blob Storage, and FSM_COS receiving verified bytes for composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12243b"/>
    </linearGradient>
    <linearGradient id="repo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8cff"/>
      <stop offset="1" stop-color="#56d6c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb7d1"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">THE DURABLE ARTIFACT BOUNDARY</text>
  <text x="600" y="88" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="16">Store immutable bytes. Verify identity. Deliver the artifact. Leave composition to FSM_COS.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="220" height="115" rx="18" fill="#162a42" stroke="#496987"/>
    <text x="165" y="183" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">HOST / MANIFEST</text>
    <text x="165" y="211" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="14">requested artifact</text>
    <text x="165" y="236" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="14">local / resident cache</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="125" width="310" height="165" rx="22" fill="url(#repo)" stroke="#a9fff1"/>
    <text x="515" y="170" text-anchor="middle" fill="#06131f" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">MICROBUNDLE</text>
    <text x="515" y="201" text-anchor="middle" fill="#06131f" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">REPOSITORY</text>
    <text x="515" y="234" text-anchor="middle" fill="#092034" font-family="Segoe UI,Arial,sans-serif" font-size="15">locate → retrieve → verify → deliver</text>
    <text x="515" y="259" text-anchor="middle" fill="#092034" font-family="Segoe UI,Arial,sans-serif" font-size="13">artifact identity is authoritative in the bytes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="150" width="220" height="115" rx="18" fill="#162a42" stroke="#496987"/>
    <text x="870" y="183" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">BLOB STORAGE</text>
    <text x="870" y="211" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="14">durable substrate</text>
    <text x="870" y="236" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="14">opaque artifact bytes</text>
  </g>

  <line x1="275" y1="207" x2="350" y2="207" stroke="#9fb7d1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="680" y1="207" x2="750" y2="207" stroke="#9fb7d1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="750" y1="247" x2="680" y2="247" stroke="#56d6c9" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="350" y1="247" x2="275" y2="247" stroke="#56d6c9" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="245" y="350" width="710" height="100" rx="20" fill="#0d1b2d" stroke="#3d5a78"/>
    <text x="600" y="383" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">VERIFIED IMMUTABLE ARTIFACT</text>
    <text x="600" y="413" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="15">MicroBundle ID  +  explicit version  +  SHA-256 content identity</text>
    <text x="600" y="437" text-anchor="middle" fill="#7ee8dc" font-family="Segoe UI,Arial,sans-serif" font-size="13">optional semantic metadata may travel with it without changing storage identity</text>
  </g>

  <line x1="515" y1="292" x2="515" y2="340" stroke="#56d6c9" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="1000" y="350" width="145" height="100" rx="18" fill="#162a42" stroke="#496987"/>
    <text x="1072" y="385" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">FSM_COS</text>
    <text x="1072" y="411" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="12">compose</text>
    <text x="1072" y="431" text-anchor="middle" fill="#b9c9dc" font-family="Segoe UI,Arial,sans-serif" font-size="12">arbitrate</text>
  </g>
  <line x1="955" y1="400" x2="990" y2="400" stroke="#56d6c9" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="488" text-anchor="middle" fill="#7891ac" font-family="Segoe UI,Arial,sans-serif" font-size="13">STORAGE IS THE SUBSTRATE  •  REPOSITORY IS THE DELIVERY BOUNDARY  •  FSM_COS IS THE COMPOSITION BOUNDARY</text>
</svg>