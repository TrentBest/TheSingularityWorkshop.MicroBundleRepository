name: Package

on:
  push:
    branches:
      - master
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports:
          - 10000:10000
    env:
      AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TheSingularityWorkshop.MicroBundleRepository.slnx
      - name: Build
        run: dotnet build TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.MicroBundleRepository.Core/TheSingularityWorkshop.MicroBundleRepository.Core.csproj --configuration Release --no-build --output ./artifacts
      - name: Pack Azure
        run: dotnet pack src/Azure/TheSingularityWorkshop.MicroBundleRepository.Azure/TheSingularityWorkshop.MicroBundleRepository.Azure.csproj --configuration Release --no-build --output ./artifacts
      - name: Pack REST
        run: dotnet pack src/REST/TheSingularityWorkshop.MicroBundleRepository.Rest/TheSingularityWorkshop.MicroBundleRepository.Rest.csproj --configuration Release --no-build --output ./artifacts
      - name: Pack FSM_COS integration
        run: dotnet pack src/FSM_COS/TheSingularityWorkshop.MicroBundleRepository.FSM_COS/TheSingularityWorkshop.MicroBundleRepository.FSM_COS.csproj --configuration Release --no-build --output ./artifacts
      - name: Validate clean package consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$RUNNER_TEMP/microbundle-package-consumer"
          mkdir -p "$consumer_dir"
          cat > "$consumer_dir/Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TheSingularityWorkshop.MicroBundleRepository.Core" Version="0.1.0-alpha.1" />
              <PackageReference Include="TheSingularityWorkshop.MicroBundleRepository.Azure" Version="0.1.0-alpha.1" />
              <PackageReference Include="TheSingularityWorkshop.MicroBundleRepository.Rest" Version="0.1.0-alpha.2" />
              <PackageReference Include="TheSingularityWorkshop.MicroBundleRepository.FSM_COS" Version="0.1.0-alpha.1" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$consumer_dir/Smoke.cs" <<'EOF'
          using TheSingularityWorkshop.MicroBundleRepository.Core;
          using TheSingularityWorkshop.MicroBundleRepository.Azure;
          using TheSingularityWorkshop.MicroBundleRepository.Rest;
          using TheSingularityWorkshop.MicroBundleRepository.FSM_COS;

          public static class PackageSmoke
          {
              public static Type[] PublicTypes =>
              [
                  typeof(MicroBundleArtifactIdentity),
                  typeof(AzureMicroBundleRepository),
                  typeof(RestMicroBundleRepository),
                  typeof(RestMicroBundleCatalog)
              ];
          }
          EOF
          cat > "$consumer_dir/NuGet.Config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="local-artifacts" value="$GITHUB_WORKSPACE/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet restore "$consumer_dir/Consumer.csproj" --configfile "$consumer_dir/NuGet.Config"
          dotnet build "$consumer_dir/Consumer.csproj" --configuration Release --no-restore
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && false }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts
      - name: Login to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: TheSingularityWorkshop
      - name: Publish packages
        shell: bash
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
