name: Package\n\non:\n  push:\n    branches:\n      - master\n      - implementation-**\n  pull_request:\n  workflow_dispatch:\n    inputs:\n      publish:\n        description: Publish packages to NuGet.org\n        required: true\n        default: false\n        type: boolean\n\npermissions:\n  contents: read\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Setup .NET\n        uses: actions/setup-dotnet@v4\n        with:\n          dotnet-version: 8.0.x\n      - name: Restore\n        run: dotnet restore TheSingularityWorkshop.MicroBundleRepository.slnx\n      - name: Build\n        run: dotnet build TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore\n      - name: Test\n        run: dotnet test TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"\n      - name: Pack Core\n        run: dotnet pack src/Core/TheSingularityWorkshop.MicroBundleRepository.Core/TheSingularityWorkshop.MicroBundleRepository.Core.csproj --configuration Release --no-build --output ./artifacts\n      - name: Pack Azure\n        run: dotnet pack src/Azure/TheSingularityWorkshop.MicroBundleRepository.Azure/TheSingularityWorkshop.MicroBundleRepository.Azure.csproj --configuration Release --no-build --output ./artifacts\n      - name: Upload packages\n        uses: actions/upload-artifact@v4\n        with:\n          name: nuget-packages\n          path: ./artifacts/*.nupkg\n\n  publish:\n    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}\n    needs: verify\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n      id-token: write\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Setup .NET\n        uses: actions/setup-dotnet@v4\n        with:\n          dotnet-version: 8.0.x\n      - name: Download packages\n        uses: actions/download-artifact@v4\n        with:\n          name: nuget-packages\n          path: ./artifacts\n      - name: Login to NuGet\n        uses: NuGet/login@v1\n        id: nuget-login\n        with:\n          user: TheSingularityWorkshop\n      - name: Publish packages\n        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate\n