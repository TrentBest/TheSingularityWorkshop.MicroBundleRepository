name: Package

on:
  push:
    branches:
      - master
      - implementation-**
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        default: Core
        type: choice
        options:
          - Core
          - Azure
          - REST
      publish:
        description: Publish the selected package to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TheSingularityWorkshop.MicroBundleRepository.slnx
      - name: Build
        run: dotnet build TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.MicroBundleRepository.Core/TheSingularityWorkshop.MicroBundleRepository.Core.csproj --configuration Release --no-build --output ./artifacts
      - name: Pack Azure
        run: dotnet pack src/Azure/TheSingularityWorkshop.MicroBundleRepository.Azure/TheSingularityWorkshop.MicroBundleRepository.Azure.csproj --configuration Release --no-build --output ./artifacts
      - name: Pack REST
        run: dotnet pack src/REST/TheSingularityWorkshop.MicroBundleRepository.Rest/TheSingularityWorkshop.MicroBundleRepository.Rest.csproj --configuration Release --no-build --output ./artifacts
      - name: Validate stable package dependency gate
        shell: python
        run: |
          import glob
          import re
          import zipfile
          import xml.etree.ElementTree as ET

          prerelease = re.compile(r"-[0-9A-Za-z]")
          failures = []

          for path in glob.glob("artifacts/*.nupkg"):
              with zipfile.ZipFile(path) as package:
                  nuspec_name = next(
                      name for name in package.namelist()
                      if name.endswith(".nuspec")
                  )
                  root = ET.fromstring(package.read(nuspec_name))
                  version = root.findtext(
                      ".//{*}metadata/{*}version"
                  ) or ""

                  if prerelease.search(version):
                      continue

                  for dep in root.findall(".//{*}metadata/{*}dependencies/{*}group/{*}dependency"):
                      dep_version = dep.attrib.get("version", "")
                      if prerelease.search(dep_version):
                          failures.append(
                              f"{path}: stable {version} has prerelease dependency "
                              f"{dep.attrib.get('id')} {dep_version}"
                          )

          if failures:
              print("Stable package dependency gate failed:")
              print("\n".join(failures))
              raise SystemExit(1)

          print("Stable package dependency gate passed.")
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts
      - name: Login to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: TheSingularityWorkshop
      - name: Publish selected package
        shell: bash
        run: |
          case "${{ inputs.package }}" in
            Core)
              package="./artifacts/TheSingularityWorkshop.MicroBundleRepository.Core.1.0.0.nupkg"
              ;;
            Azure)
              package="./artifacts/TheSingularityWorkshop.MicroBundleRepository.Azure.0.1.0-alpha.1.nupkg"
              ;;
            REST)
              package="./artifacts/TheSingularityWorkshop.MicroBundleRepository.Rest.0.1.0-alpha.3.nupkg"
              ;;
            *)
              echo "Unsupported package selection: ${{ inputs.package }}"
              exit 1
              ;;
          esac

          test -f "$package"
          dotnet nuget push "$package" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
