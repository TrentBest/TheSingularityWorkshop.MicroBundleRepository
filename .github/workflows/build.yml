name: Build and Test

on:
  push:
    branches:
      - master
      - development
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7

      - name: Setup .NET
        uses: a98b56852c35b8e3190ac28c8c2271da59106c68 # actions/setup-dotnet v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.MicroBundleRepository.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
  source-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MicroBundleRepository
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          path: TheSingularityWorkshop.MicroBundleRepository

      - name: Checkout FSM_REST source
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_REST
          ref: development
          path: TheSingularityWorkshop.FSM_REST

      - name: Checkout FSM_COS source
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: development
          path: TheSingularityWorkshop.FSM_COS

      - name: Checkout FSM_API source
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: FSM_API

      - name: Checkout FSM_UserIO source
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          repository: TrentBest/FSM_UserIO
          ref: development
          path: FSM_UserIO

      - name: Checkout MicroBundleDomain source
        uses: 3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: TheSingularityWorkshop.MicroBundleDomain

      - name: Setup .NET
        uses: a98b56852c35b8e3190ac28c8c2271da59106c68 # actions/setup-dotnet v6
        with:
          dotnet-version: 8.0.x

      - name: Restore source-integrated solution
        working-directory: TheSingularityWorkshop.MicroBundleRepository
        run: dotnet restore TheSingularityWorkshop.MicroBundleRepository.slnx -p:WorkshopUseRepositorySources=true

      - name: Build source-integrated solution
        working-directory: TheSingularityWorkshop.MicroBundleRepository
        run: dotnet build TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-restore -p:WorkshopUseRepositorySources=true

      - name: Test source-integrated solution
        working-directory: TheSingularityWorkshop.MicroBundleRepository
        run: dotnet test TheSingularityWorkshop.MicroBundleRepository.slnx --configuration Release --no-build -p:WorkshopUseRepositorySources=true

