name: CiAi Repository Observation

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to observe (defaults to this workflow's commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ciai-repository-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout CiAi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: development
          path: CiAi
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Observe this repository's CI evidence
        env:
          CIAI_GITHUB_TOKEN: ${{ secrets.CIAI_GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA." >&2
            exit 64
          fi
          mkdir -p artifacts/ciai
          dotnet run --project CiAi/samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release -- "$TARGET_REPOSITORY" "$TARGET_SHA" artifacts/ciai/commit-observation.json

      - name: Upload CiAi observation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ciai-repository-observation
          path: artifacts/ciai/
          if-no-files-found: error
          retention-days: 14
