name: CiAi Repository Observation

on:
  push:
    branches: [master, development]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to observe (defaults to this workflow's commit)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ciai-repository-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout CiAi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: development
          path: CiAi
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Wait for Build and Package evidence to finish
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            runs=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}")
            build_status=$(jq -r '[.workflow_runs[] | select(.head_sha == env.TARGET_SHA and .path == ".github/workflows/build.yml")] | sort_by(.run_number) | last | .status // "missing"' <<< "${runs}")
            package_status=$(jq -r '[.workflow_runs[] | select(.head_sha == env.TARGET_SHA and .path == ".github/workflows/package.yml")] | sort_by(.run_number) | last | .status // "missing"' <<< "${runs}")
            echo "Attempt ${attempt}/90: Build and Test=${build_status}; Package=${package_status}"
            if [[ "${build_status}" == "completed" && "${package_status}" == "completed" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Build and Package workflows for ${TARGET_SHA}." >&2
          exit 1

      - name: Observe this repository's CI evidence
        env:
          CIAI_GITHUB_TOKEN: ${{ secrets.CIAI_GITHUB_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA." >&2
            exit 64
          fi
          mkdir -p artifacts/ciai
          dotnet run --project CiAi/samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release -- "$TARGET_REPOSITORY" "$TARGET_SHA" artifacts/ciai/commit-observation.json

      - name: Upload CiAi observation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ciai-repository-observation
          path: artifacts/ciai/
          if-no-files-found: error
          retention-days: 14
